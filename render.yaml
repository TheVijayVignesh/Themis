services:
  - type: web
    name: themis
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /themis/healthz
    envVars:
      - key: BASE_PATH
        value: /themis
      - key: DEMO_MODEL_TYPE
        value: logistic_regression
      - key: MAX_UPLOAD_MB
        value: "10"
